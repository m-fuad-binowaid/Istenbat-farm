<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استنبات | ISTENBAT - المزرعة الحرفية العضوية والسياحة الريفية بالدلم</title>
    <script>
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var isGitHubPages = l.hostname.endsWith('github.io');
        var repoName = pathSegments[0] || 'Istenbat-farm';
        var subRoute = isGitHubPages ? pathSegments.slice(1).join('/') : pathSegments.join('/');
        var basePath = isGitHubPages ? ('/' + repoName) : '';

        var targetPath = basePath + '/' + (subRoute || '');
        if (targetPath === l.pathname) {
          window.location.replace(basePath || '/');
        } else {
          window.location.replace(targetPath + (l.search ? l.search : ''));
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background-color: #F9F6F0; color: #1C3322;">
    <p>جاري تحويلك إلى مزرعة بيت الاستنبات...</p>
    <p style="font-size: 13px; color: #666;">Redirecting to Istenbat Farm...</p>
  </body>
</html>
